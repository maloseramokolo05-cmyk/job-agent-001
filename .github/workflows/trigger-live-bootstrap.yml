name: Trigger live bootstrap

on:
  push:
    branches:
      - fix/migrate-google-bootstrap-on-startup

jobs:
  trigger-production:
    runs-on: ubuntu-latest
    steps:
      - name: Start production once
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /tmp/job-agent-response -w '%{http_code}' https://tumelo-job-agent.vercel.app/)"
            if [ "$code" = "200" ]; then
              echo "Production responded with HTTP 200"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code"
            sleep 5
          done
          echo "Production did not return HTTP 200"
          cat /tmp/job-agent-response || true
          exit 1
